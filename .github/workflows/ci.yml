name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Static checks and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Pin npm
        run: |
          npm install -g npm@9.9.4
          npm --version

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Audit BFF production dependencies
        run: |
          npm ci --omit=dev --prefix bff
          npm audit --omit=dev --audit-level=high --prefix bff

      - name: Run CI checks
        run: npm run ci:pr

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: audit-artifacts
          path: work/audits
          if-no-files-found: ignore
